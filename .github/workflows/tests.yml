name: Tests
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install ruff && ruff format --check src mac tests scripts && ruff check src mac tests scripts
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: node --test tests/frontend.test.mjs
      - run: python scripts/build_demo.py --check
      - run: python -m compileall -q src mac
