name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ["data/state.json", "data/review_queue.json"]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q src mac
