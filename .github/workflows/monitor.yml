name: Job Monitor
# Public edition: manual-only. A scheduled run here would post job matches to a
# public issue and commit state into a public repo. To run your own private
# instance, keep the repository private and restore a schedule, e.g.:
#   schedule:
#     - cron: "7 */2 * * *"
# Alerts and state persistence are opt-in via repository variables
# (ENABLE_ALERTS, PERSIST_STATE = "true").
on:
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: job-monitor-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Monitor official boards and discovery sources
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ vars.ENABLE_ALERTS == 'true' && secrets.GITHUB_TOKEN || '' }}
          GITHUB_ALERT_MENTION: ${{ github.repository_owner }}
        run: python src/run_monitor.py
      - name: Persist durable state and queue
        if: vars.PERSIST_STATE == 'true'
        run: |
          git config user.name job-monitor-bot
          git config user.email actions@github.com
          git add -f data/state.json data/review_queue.json
          git diff --staged --quiet && exit 0
          git commit -m "Update job monitor state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
