name: Job Monitor
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: job-monitor-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Monitor official boards and discovery sources
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ALERT_MENTION: ${{ github.repository_owner }}
        run: python src/run_monitor.py
      - name: Persist durable state and queue
        run: |
          git config user.name job-monitor-bot
          git config user.email actions@github.com
          git add data/state.json data/review_queue.json
          git diff --staged --quiet && exit 0
          git commit -m "Update job monitor state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
