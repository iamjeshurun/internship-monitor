name: Priority Program Monitor
on:
  # Kept as a manual fallback. The scheduled priority watcher runs locally on
  # macOS, where repeated short jobs do not consume GitHub-hosted minutes.
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: priority-program-monitor-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Monitor priority programs
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ALERT_MENTION: ${{ github.repository_owner }}
        run: python src/run_priority_monitor.py
      - name: Persist priority state and queue
        run: |
          git config user.name job-monitor-bot
          git config user.email actions@github.com
          git add data/priority_state.json data/priority_queue.json
          git diff --staged --quiet && exit 0
          git commit -m "Update priority program state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
